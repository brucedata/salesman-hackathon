name: 기능 제안
description: 해결하고 싶은 사용자 문제를 알려 주세요.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제
      description: 누가 어떤 상황에서 불편을 겪나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 동작
      description: 사용자가 무엇을 할 수 있게 되나요? 완료되었는지 확인할 예시를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안과 추가 고려사항
      description: 다른 방법, 외부 서비스 비용, 데이터 전달 또는 저장 방식의 변화가 있다면 적어 주세요. 비밀 키는 포함하지 마세요.
