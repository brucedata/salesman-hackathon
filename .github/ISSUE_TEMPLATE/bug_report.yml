name: 버그 제보
description: 오류를 재현할 수 있도록 알려 주세요.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        보안 취약점은 공개 제보 대신 [SECURITY.md](https://github.com/brucedata/salesman-hackathon/blob/main/SECURITY.md)를 확인하세요.
        API 키, 문의 원문, 전화번호 등 민감한 정보는 포함하지 마세요.
  - type: textarea
    id: behavior
    attributes:
      label: 예상 동작과 실제 동작
      description: 어느 화면에서 무엇이 달랐나요?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      description: 예시 데이터로 재현 가능한 단계를 적어 주세요.
      placeholder: |
        1. 수신함에서 예시 문의를 연다.
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: OS, 브라우저, Node 버전, 커밋, dev/preview 여부, 연결한 공급자 이름(키 제외)을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 추가 자료
      description: 민감한 정보를 제거한 오류 메시지나 스크린샷이 있다면 추가해 주세요.
